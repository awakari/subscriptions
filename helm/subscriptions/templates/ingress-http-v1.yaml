{{- if .Values.ingressHttpV1.enabled -}}
{{- $fullName := include "subscriptions.fullname" . -}}
{{- $svcPort := .Values.service.http.port -}}
{{- if and .Values.ingressHttpV1.className (not (semverCompare ">=1.18-0" .Capabilities.KubeVersion.GitVersion)) }}
  {{- if not (hasKey .Values.ingressHttpV1.annotations "kubernetes.io/ingress.class") }}
  {{- $_ := set .Values.ingressHttpV1.annotations "kubernetes.io/ingress.class" .Values.ingressHttpV1.className}}
  {{- end }}
{{- end }}
{{- if semverCompare ">=1.19-0" .Capabilities.KubeVersion.GitVersion -}}
apiVersion: networking.k8s.io/v1
{{- else if semverCompare ">=1.14-0" .Capabilities.KubeVersion.GitVersion -}}
apiVersion: networking.k8s.io/v1beta1
{{- else -}}
apiVersion: extensions/v1beta1
{{- end }}
kind: Ingress
metadata:
  name: "{{ $fullName }}-http-v1"
  labels:
    {{- include "subscriptions.labels" . | nindent 4 }}
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    cert-manager.io/issuer: "{{ .Values.cert.issuer.name }}-subscriptions"
    nginx.ingress.kubernetes.io/limit-rps: "{{ .Values.ingressHttpV1.limit.rate.second }}"
    nginx.ingress.kubernetes.io/limit-rpm: "{{ .Values.ingressHttpV1.limit.rate.minute }}"
    nginx.ingress.kubernetes.io/limit-connections: "{{ .Values.ingressHttpV1.limit.connections }}"
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-origin: "{{ .Values.ingressHttpV1.corsAllowOrigin }}"
    nginx.ingress.kubernetes.io/cors-allow-methods: "HEAD, OPTIONS, GET, POST"
    nginx.ingress.kubernetes.io/cors-allow-headers: "Authorization,If-None-Match,X-Awakari-Group-Id,X-Awakari-User-Id"
spec:
  {{- if and .Values.ingressHttpV1.className (semverCompare ">=1.18-0" .Capabilities.KubeVersion.GitVersion) }}
  ingressClassName: {{ .Values.ingressHttpV1.className }}
  {{- end }}
  {{- if .Values.ingressHttpV1.tls }}
  tls:
    {{- range .Values.ingressHttpV1.tls }}
    - hosts:
        {{- range .hosts }}
        - {{ . | quote }}
        {{- end }}
      secretName: {{ .secretName }}
    {{- end }}
  {{- end }}
  rules:
    {{- range .Values.ingressHttpV1.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- range .paths }}
          - path: "{{ .path }}"
            {{- if and .pathType (semverCompare ">=1.18-0" $.Capabilities.KubeVersion.GitVersion) }}
            pathType: {{ .pathType }}
            {{- end }}
            backend:
              {{- if semverCompare ">=1.19-0" $.Capabilities.KubeVersion.GitVersion }}
              service:
                name: {{ $fullName }}
                port:
                  number: {{ $svcPort }}
              {{- else }}
              serviceName: {{ $fullName }}
              servicePort: {{ $svcPort }}
              {{- end }}
          {{- end }}
    {{- end }}
{{- end }}
